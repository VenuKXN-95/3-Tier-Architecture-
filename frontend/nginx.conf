server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── React SPA routing ─────────────────────────────────────────────
    # All routes that don't match a static file are served index.html
    # so React Router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ─────────────────────────────────────────────────────
    # Forward /api/* and /health to the backend service.
    # 'backend' is the Docker Compose service name — it resolves via
    # Docker's internal DNS to the backend container IP.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location /health {
        proxy_pass         http://backend:8000/health;
        proxy_set_header   Host $host;
        proxy_http_version 1.1;
    }

    location /docs {
        proxy_pass         http://backend:8000/docs;
        proxy_set_header   Host $host;
        proxy_http_version 1.1;
    }

    # ── Gzip compression ──────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Cache static assets ───────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
