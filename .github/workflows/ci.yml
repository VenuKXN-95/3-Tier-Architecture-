name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Python Backend CI (Formatting, Linting, Typing, SAST, Pytest)
  # ───────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (Python / FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start MongoDB (Replica Set rs0)
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          echo "Waiting for MongoDB container..."
          until docker exec mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q "1"; do
            sleep 1
          done
          echo "Initiating replica set rs0..."
          docker exec mongodb mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          echo "Waiting for replica set primary status..."
          until docker exec mongodb mongosh --quiet --eval "rs.isMaster().ismaster" | grep -q "true"; do
            sleep 1
          done
          echo "MongoDB replica set initialized!"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code Formatting Check (Black)
        run: black --check app tests

      - name: Code Linting (Flake8)
        run: flake8 app tests --max-line-length=88 --extend-ignore=E203,W503,E402

      - name: Deep Code Analysis (Pylint)
        run: pylint --rcfile=pyproject.toml app

      - name: Static Type Checking (Mypy)
        run: PYTHONPATH=. mypy --config-file pyproject.toml app

      - name: Security Code Analysis (Bandit)
        run: bandit -r app -c pyproject.toml

      - name: Dependency Security Audit (pip-audit)
        run: pip-audit -r requirements.txt --ignore-code PYSEC-2024-001 || true

      - name: Run Pytest Test Suite & Export Coverage
        env:
          PYTHONPATH: "."
          MONGO_URI: "mongodb://localhost:27017/?replicaSet=rs0"
          MONGO_DB_NAME: "ecommerce_test"
          APP_NAME: "E-Commerce Test System"
          DEBUG: "true"
        run: |
          pytest tests --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: React Frontend CI (Linting, Typing, Build Verification)
  # ───────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (React / TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint Frontend Code (ESLint)
        run: npm run lint

      - name: TypeScript Type Checking (tsc)
        run: npx tsc --noEmit

      - name: Verify Production Build (Vite)
        run: npm run build

      - name: Dependency Security Audit (npm audit)
        run: npm audit --audit-level=high || true

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: SonarQube Code Analysis & Quality Gate Enforcement
  # ───────────────────────────────────────────────────────────────────────────
  sonarqube-analysis:
    name: SonarQube Code Analysis & Quality Gate
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: always() && needs.backend-ci.result == 'success' && needs.frontend-ci.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Backend Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-report
          path: backend

      - name: SonarQube / SonarCloud Scan & Quality Gate
        uses: sonarsource/sonarqube-scan-action@v5.0.0
        with:
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

  # ───────────────────────────────────────────────────────────────────────────
  # Job 4: Static Security Scanning (Gitleaks, Hadolint, Trivy FS)
  # ───────────────────────────────────────────────────────────────────────────
  security-scans:
    name: Security & Vulnerability Scanning
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Lint Backend Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

      - name: Lint Frontend Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error

      - name: Repository Filesystem Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  # ───────────────────────────────────────────────────────────────────────────
  # Job 5: Docker Container Build & Trivy Image Security Enforcement
  # ───────────────────────────────────────────────────────────────────────────
  docker-build-and-trivy:
    name: Docker Build & Trivy Image Security Scan
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        run: |
          docker build -t ecommerce-backend:${{ github.sha }} ./backend

      - name: Build Frontend Container Image
        run: |
          docker build -t ecommerce-frontend:${{ github.sha }} ./frontend

      - name: Trivy Vulnerability Scan (Backend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ecommerce-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Trivy Vulnerability Scan (Frontend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ecommerce-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
