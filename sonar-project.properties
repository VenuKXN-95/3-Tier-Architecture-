# ═══════════════════════════════════════════════════════════════════════
# SonarQube & SonarCloud Scanner Configuration
# Repository: 3-Tier E-Commerce Application (FastAPI + React + MongoDB)
# ═══════════════════════════════════════════════════════════════════════

sonar.projectKey=ecommerce-3tier-app
sonar.projectName=3-Tier E-Commerce Application
sonar.projectVersion=1.0.0

# Encoding
sonar.sourceEncoding=UTF-8

# Source directories for multi-tier repository
sonar.sources=backend/app,frontend/src

# Test directories
sonar.tests=backend/tests

# Exclusions (node_modules, build artifacts, virtual environments)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.ts,**/*.test.tsx,backend/tests/**,**/venv/**,**/.mypy_cache/**

# Python Coverage Report path
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.11

# JavaScript / TypeScript settings
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
